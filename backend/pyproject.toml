[project]
name = "hindsight"
version = "0.1.0"
description = "On-call agent for your data platform: reads DataHub lineage, diagnoses incidents, writes postmortems back"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "sse-starlette>=2.1,<4",
    "mcp>=1.9,<2",
    "google-genai>=1.0,<2",
    "anthropic>=0.40",
    "boto3>=1.35,<2",
    "typer>=0.12,<1",
    "rich>=13.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
hindsight = "hindsight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"
