name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'examples/**'
      - 'scenarios/build_recordings.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: python3 scenarios/build_recordings.py
        working-directory: ${{ github.workspace }}
      - run: npm run build
        env:
          VITE_BASE: /hindsight/
          VITE_DEMO_MODE: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
